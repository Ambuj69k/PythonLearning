<html>
    <head>
        <title>Marks Form</title>
        <link rel="stylesheet" href="{{url_for('static',filename='style/style.css')}}">
        <script type="text/javascript" src="{{url_for('static',filename='script/alert.js')}}"></script>
    </head>
    <body>
        <h1>
            Welcome to my Destroyed World
        </h1>
     

        <h2>Enter Your Marks</h2>
        <form action="/submit" method="post">
            <label for="science">Science:</label>
            <input type="number" id="science" name="science" min="0" max="100" required>
            <br><br>

            <label for="maths">Maths:</label>
            <input type="number" id="maths" name="maths" min="0" max="100" required>
            <br><br>

            <label for="english">English:</label>
            <input type="number" id="english" name="english" min="0" max="100" required>
            <br><br>

            <label for="hindi">Hindi:</label>
            <input type="number" id="hindi" name="hindi" min="0" max="100" required>
            <br><br>

            <input type="submit" value="Submit">
        </form>
    </body>
</html>
